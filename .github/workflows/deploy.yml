name: Deploy to Nekoweb
on:
  push:
    branches:
      - deploy

jobs:
  deploy_to_nekoweb:
    name: Deploy to Nekoweb
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repo's deploy branch
        run: |
          git clone https://github.com/ajredden/jackdaw.nekoweb.org.git
          git checkout deploy
      - name: Install dependencies
        run: | 
          pwd
          ls -l
          npm install
      - name: Build
        run: npm run build
      - name: (Placeholder) list directory
        run: ls -l prod/